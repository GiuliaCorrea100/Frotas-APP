server {
    listen 80;
    server_name _;

    server_tokens off;

    # Limite de upload (exemplo: 50 MB)
    client_max_body_size 50M;

    # Pasta onde ficam os arquivos do build do Vite
    root /usr/share/nginx/html;
    index index.html;

    # Logs (ajuste se quiser desativar em prod)
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Cache e compressão
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 256;

    # Cabeçalhos de segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Arquivos estáticos - cache longo
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4|webm)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Cache curto para HTML
    location ~* \.(?:html)$ {
        expires 1h;
        add_header Cache-Control "no-cache";
    }

    # Single Page Application (SPA) fallback
    location / {
        try_files $uri /index.html;
    }

    # Negar acesso a arquivos sensíveis
    location ~ /\.(?!well-known) {
        deny all;
    }
}
