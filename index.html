<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frotas UNIR</title>

    <!-- CSS da aplicação -->
    <link rel="stylesheet" href="/frotasunir/src/app.css" />

    <!-- Fontes do Governo Federal -->
    <link href="https://fonts.cdnfonts.com/css/rawline" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Raleway:300,400,500,600,700,800,900&amp;display=swap"
    />

    <style>
      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      #barra-brasil {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 10000;
        background: #7f7f7f;
        height: 30px;
        padding: 0 0 0 10px;
        border-bottom: 1px solid #888;
        display: flex;
        align-items: center;
      }

      #barra-brasil a {
        color: white;
        text-decoration: none;
        font-family: sans-serif;
        font-size: 13px;
      }

      #barra-brasil ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
      }

      #barra-brasil li {
        margin-right: 10px;
        padding-right: 10px;
        border-right: 1px solid #ededed;
      }

      #root {
        margin-top: 30px; 
        width: 100%;
      }
    </style>
  </head>

  <body>
    <!-- Barra do Governo Federal -->
    <div id="barra-brasil">
      <ul id="menu-barra-temp">
        <li>
          <a href="http://brasil.gov.br" target="_blank"
            >Portal do Governo Brasileiro</a
          >
        </li>
      </ul>
    </div>

    <!-- Aplicacao React -->
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>

    <!-- Script oficial da barra do Governo -->
    <script
      defer="defer"
      src="//barra.brasil.gov.br/barra_2.0.js"
      type="text/javascript"
    ></script>

    <!-- Ajuste dinamico da margem -->
    <script>
      window.addEventListener('load', function () {
        const barra = document.getElementById('barra-brasil');
        const root = document.getElementById('root');
        if (barra && root) {
          const altura = barra.offsetHeight;
          root.style.marginTop = altura + 'px';
        }
      });
    </script>
  </body>
</html>
