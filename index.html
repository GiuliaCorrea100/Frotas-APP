<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frotas UNIR</title>

    <!-- CSS da aplicação -->
    <link rel="stylesheet" href="/frotasunir/src/app.css" />

    <!-- Fontes do Governo Federal -->
    <link href="https://fonts.cdnfonts.com/css/rawline" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Raleway:300,400,500,600,700,800,900&amp;display=swap"
    />

    <style>
      /* Estilo para garantir que a barra do governo não quebre o layout */
      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      
      #barra-brasil {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 10000;
        border-bottom: #888 1px solid;
        height: 46px !important;
      }      
    </style>

  </head>

  <body>
    <!-- Barra Governo Federal -->
    <div id="barra-brasil" style="background:#7F7F7F; height: 44px !important; padding:0 0 0 10px;display:block;">
      <ul id="menu-barra-temp" style="list-style:none;">
        <li style="display:inline; float:left;padding-right:10px; margin-right:10px; border-right:1px solid #EDEDED">
            <a href="http://brasil.gov.br" style="font-family:sans,sans-serif; text-decoration:none; color:white;">Portal do Governo Brasileiro</a>
        </li>
      </ul>
    </div>

    <!-- Aplicacao React -->
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>

     <!-- Barra Governo Federal -->
    <script defer="defer" src="/src/assets/barra_2.0.js" type="text/javascript"></script>

    <!-- Ajuste dinamico da margem -->
    <script>
      window.addEventListener('load', function () {
        const barra = document.getElementById('barra-brasil');
        const root = document.getElementById('root');
        if (barra && root) {
          const altura = barra.offsetHeight;
          root.style.marginTop = altura + 'px';
        }
      });
    </script>
  </body>
</html>
